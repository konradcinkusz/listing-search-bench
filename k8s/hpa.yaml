apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: listing-search
  namespace: listing-search
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: listing-search
  # Pinned to 1/1 — a no-op scaler for now, kept for shape rather than deleted.
  # Scaling out is unsafe until IEventIdempotencyStore is persistent and shared
  # (ADR-0006, k8s/deployment.yaml); raise these once that lands.
  minReplicas: 1
  maxReplicas: 1
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
