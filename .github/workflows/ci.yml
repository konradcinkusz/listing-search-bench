name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-docs:
    name: Lint docs and eval corpus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run lint

  build-test:
    name: Build and test (unit, Layer 1, mutation pass, judge machinery)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore ListingSearch.slnx

      - name: Build
        run: dotnet build ListingSearch.slnx --no-restore --configuration Release

      - name: Test — ListingSearch.Service.Tests (unit + HTTP surface)
        run: dotnet test --project tests/ListingSearch.Service.Tests/ListingSearch.Service.Tests.csproj --no-build --configuration Release --report-trx

      - name: Test — ListingSearch.Evals (Layer 1, mutation pass, judge machinery)
        run: dotnet test --project evals/ListingSearch.Evals/ListingSearch.Evals.csproj --no-build --configuration Release --report-trx

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trx-results
          path: "**/TestResults/*.trx"
          if-no-files-found: warn

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # REPO-BASELINE.md §1 pairs SAST with a dependency audit: "vulnerable pins
      # nobody owns". Dependabot opens PRs for updates; this job is the other half
      # — it fails the build while a known-vulnerable package is still pinned,
      # rather than waiting for someone to merge the bot's PR.
      #
      # The gotcha this handles: `dotnet list package --vulnerable` exits 0 whether
      # or not it found anything. Grepping its output is the only way to gate on it.
      - name: NuGet packages, including transitive
        run: |
          set -euo pipefail
          dotnet restore ListingSearch.slnx
          report=$(dotnet list ListingSearch.slnx package --vulnerable --include-transitive)
          echo "$report"
          if echo "$report" | grep -q "has the following vulnerable packages"; then
            echo "::error::Vulnerable NuGet package(s) found — see the report above."
            exit 1
          fi
          echo "No vulnerable NuGet packages."

      # npm here is repo tooling only (lint, schema validation, the mermaid CLI the
      # papers render through). Nothing it pulls ships in a container, so the gate is
      # set at 'high' rather than 'low': a moderate advisory in a dev-only markdown
      # linter is not worth blocking a documentation fix over.
      - name: npm tooling
        run: |
          set -euo pipefail
          npm ci
          npm audit --audit-level=high

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # A pinned binary rather than gitleaks-action, which derives a commit
      # range per event and scans only that. Two ways that range goes wrong:
      # it cannot be resolved at all when its base is the root commit (no
      # parent), and a range scan by construction never re-reads history it
      # has already walked. Scanning the whole history every run has neither
      # failure mode and costs about a third of a second on this repository.
      - name: gitleaks
        env:
          GITLEAKS_VERSION: 8.24.3
        run: |
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks detect --source . --redact --exit-code 1
