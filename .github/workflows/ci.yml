name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-docs:
    name: Lint docs and eval corpus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run lint

  build-test:
    name: Build and test (unit, Layer 1, mutation pass, judge machinery)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore ListingSearch.slnx

      - name: Build
        run: dotnet build ListingSearch.slnx --no-restore --configuration Release

      - name: Test — ListingSearch.Service.Tests (unit + HTTP surface)
        run: dotnet test --project tests/ListingSearch.Service.Tests/ListingSearch.Service.Tests.csproj --no-build --configuration Release --report-trx

      - name: Test — ListingSearch.Evals (Layer 1, mutation pass, judge machinery)
        run: dotnet test --project evals/ListingSearch.Evals/ListingSearch.Evals.csproj --no-build --configuration Release --report-trx

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trx-results
          path: "**/TestResults/*.trx"
          if-no-files-found: warn

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # A pinned binary rather than gitleaks-action, which derives a commit
      # range per event and scans only that. Two ways that range goes wrong:
      # it cannot be resolved at all when its base is the root commit (no
      # parent), and a range scan by construction never re-reads history it
      # has already walked. Scanning the whole history every run has neither
      # failure mode and costs about a third of a second on this repository.
      - name: gitleaks
        env:
          GITLEAKS_VERSION: 8.24.3
        run: |
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks detect --source . --redact --exit-code 1
