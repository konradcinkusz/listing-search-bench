# Local development only — never what CI runs against (ADR-0002). Brings up a
# single-node Elasticsearch cluster and Kibana so ElasticsearchIndex.cs can be
# exercised by hand against something real; docs/DEVIATIONS.md D-4 records that
# nothing in this repository's automated suite has ever done so.
#
#   docker compose up -d
#   dotnet run --project src/Homefinder.SearchService -- \
#     --SearchIndex:Mode=Elasticsearch \
#     --SearchIndex:ElasticsearchUri=http://localhost:9200
#
# Kibana: http://localhost:5601

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: homefinder-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.0
    container_name: homefinder-kibana
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"

volumes:
  elasticsearch-data:
